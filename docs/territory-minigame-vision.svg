<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="900" fill="#1b1326"/>
  <text x="700" y="50" text-anchor="middle" font-size="34" font-weight="bold" fill="#ffb347">Territory minigame — game vision</text>
  <text x="700" y="82" text-anchor="middle" font-size="18" fill="#cdbfe0">Solo vs computer · 3D almost top-down · 5 sites on a line · goal: collect as many candies as possible</text>

  <!-- Battlefield -->
  <rect x="40" y="110" width="1320" height="380" rx="18" fill="#2a1d3d" stroke="#4a3566" stroke-width="2"/>
  <text x="60" y="140" font-size="16" fill="#9a88b5">BATTLEFIELD (start of the game)</text>

  <!-- road -->
  <rect x="120" y="290" width="1160" height="40" rx="20" fill="#3a2b52"/>
  <line x1="120" y1="310" x2="1280" y2="310" stroke="#5a4580" stroke-width="3" stroke-dasharray="14 12"/>

  <!-- Sites -->
  <g font-size="15" text-anchor="middle" fill="#fff" font-weight="bold">
    <circle cx="200" cy="310" r="55" fill="#2e8bff" stroke="#fff" stroke-width="4"/>
    <text x="200" y="316">SITE 1</text>
    <circle cx="450" cy="310" r="55" fill="#d94a4a" stroke="#fff" stroke-width="4"/>
    <text x="450" y="316">SITE 2</text>
    <circle cx="700" cy="310" r="55" fill="#d94a4a" stroke="#fff" stroke-width="4"/>
    <text x="700" y="316">SITE 3</text>
    <circle cx="950" cy="310" r="55" fill="#d94a4a" stroke="#fff" stroke-width="4"/>
    <text x="950" y="316">SITE 4</text>
    <circle cx="1200" cy="310" r="55" fill="#d94a4a" stroke="#fff" stroke-width="4"/>
    <text x="1200" y="316">SITE 5</text>
  </g>

  <!-- Owner labels -->
  <g font-size="15" text-anchor="middle" font-weight="bold">
    <text x="200" y="395" fill="#6db3ff">PLAYER</text>
    <text x="450" y="395" fill="#ff8a8a">ENEMY</text>
    <text x="700" y="395" fill="#ff8a8a">ENEMY</text>
    <text x="950" y="395" fill="#ff8a8a">ENEMY</text>
    <text x="1200" y="395" fill="#ff8a8a">ENEMY</text>
  </g>

  <!-- Home spawns -->
  <rect x="50" y="268" width="50" height="84" rx="8" fill="#1d5fb8" stroke="#fff" stroke-width="2"/>
  <text x="75" y="262" text-anchor="middle" font-size="13" fill="#6db3ff">home</text>
  <rect x="1300" y="268" width="50" height="84" rx="8" fill="#a32f2f" stroke="#fff" stroke-width="2"/>
  <text x="1325" y="262" text-anchor="middle" font-size="13" fill="#ff8a8a">home</text>

  <!-- Player units marching -> -->
  <g>
    <circle cx="275" cy="300" r="12" fill="#6db3ff"/><text x="275" y="305" text-anchor="middle" font-size="13" fill="#000">R</text>
    <circle cx="305" cy="322" r="12" fill="#6db3ff"/><text x="305" y="327" text-anchor="middle" font-size="13" fill="#000">G</text>
    <circle cx="335" cy="300" r="14" fill="#6db3ff"/><text x="335" y="305" text-anchor="middle" font-size="13" fill="#000">M</text>
  </g>
  <path d="M355 310 L395 310" stroke="#6db3ff" stroke-width="4" marker-end="url(#ab)"/>
  <!-- Enemy units marching <- -->
  <g>
    <circle cx="1105" cy="300" r="12" fill="#ff8a8a"/><text x="1105" y="305" text-anchor="middle" font-size="13" fill="#000">R</text>
    <circle cx="1075" cy="322" r="14" fill="#ff8a8a"/><text x="1075" y="327" text-anchor="middle" font-size="13" fill="#000">M</text>
    <circle cx="1045" cy="300" r="12" fill="#ff8a8a"/><text x="1045" y="305" text-anchor="middle" font-size="13" fill="#000">G</text>
  </g>
  <path d="M1025 310 L985 310" stroke="#ff8a8a" stroke-width="4" marker-end="url(#ar)"/>

  <defs>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6db3ff"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ff8a8a"/></marker>
  </defs>

  <!-- Callouts -->
  <text x="200" y="195" text-anchor="middle" font-size="15" fill="#fff">Units spawn at your</text>
  <text x="200" y="215" text-anchor="middle" font-size="15" fill="#fff">most-forward site</text>
  <path d="M200 225 L200 248" stroke="#fff" stroke-width="2" marker-end="url(#aw)"/>
  <defs><marker id="aw" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#fff"/></marker></defs>

  <text x="700" y="195" text-anchor="middle" font-size="15" fill="#fff">Kill the defenders → the site flips at once.</text>
  <text x="700" y="215" text-anchor="middle" font-size="15" fill="#fff">Units keep marching to the next site.</text>
  <path d="M700 225 L700 248" stroke="#fff" stroke-width="2" marker-end="url(#aw)"/>

  <text x="1200" y="195" text-anchor="middle" font-size="15" fill="#fff">Enemy AI: fixed timer,</text>
  <text x="1200" y="215" text-anchor="middle" font-size="15" fill="#fff">random unit each time</text>
  <path d="M1200 225 L1200 248" stroke="#fff" stroke-width="2" marker-end="url(#aw)"/>

  <text x="700" y="450" text-anchor="middle" font-size="16" fill="#cdbfe0">Legend: R = Rogue (cheap, weak) · G = Ranger (medium) · M = Mage (expensive, strong) — enemy uses the same models, tinted red</text>

  <!-- HUD mockup -->
  <rect x="40" y="520" width="1320" height="340" rx="18" fill="#241833" stroke="#4a3566" stroke-width="2"/>
  <text x="60" y="550" font-size="16" fill="#9a88b5">HUD (player view)</text>

  <!-- top bar -->
  <rect x="80" y="570" width="1240" height="50" rx="10" fill="#33244a"/>
  <text x="110" y="603" font-size="22" fill="#ffb347" font-weight="bold">🍬 Candies: 35</text>
  <text x="700" y="603" text-anchor="middle" font-size="22" fill="#fff" font-weight="bold">⏱ 2:15</text>
  <text x="1290" y="603" text-anchor="end" font-size="20" fill="#6db3ff">Sites: 2 / 5</text>
  <text x="520" y="603" text-anchor="middle" font-size="22" fill="#7dff9a" font-weight="bold">+10</text>
  <text x="520" y="625" text-anchor="middle" font-size="12" fill="#7dff9a">(every 20s: 5 per site)</text>

  <!-- Buttons -->
  <g font-size="18" text-anchor="middle" fill="#fff" font-weight="bold">
    <rect x="360" y="700" width="200" height="100" rx="14" fill="#3b6e3b" stroke="#fff" stroke-width="3"/>
    <text x="460" y="735">ROGUE</text>
    <text x="460" y="760" font-size="14" font-weight="normal">cheap · weak</text>
    <text x="460" y="785" font-size="14" font-weight="normal">cooldown: short</text>

    <rect x="600" y="700" width="200" height="100" rx="14" fill="#3b5e8e" stroke="#fff" stroke-width="3"/>
    <text x="700" y="735">RANGER</text>
    <text x="700" y="760" font-size="14" font-weight="normal">medium</text>
    <text x="700" y="785" font-size="14" font-weight="normal">cooldown: medium</text>

    <rect x="840" y="700" width="200" height="100" rx="14" fill="#6a3b8e" stroke="#fff" stroke-width="3"/>
    <text x="940" y="735">MAGE</text>
    <text x="940" y="760" font-size="14" font-weight="normal">expensive · strong</text>
    <text x="940" y="785" font-size="14" font-weight="normal">cooldown: long</text>
    <!-- cooldown overlay on mage -->
    <rect x="840" y="700" width="200" height="45" rx="14" fill="#000" opacity="0.5"/>
  </g>
  <text x="940" y="830" text-anchor="middle" font-size="13" fill="#cdbfe0">↑ one cooldown per button (here: Mage recharging)</text>
  <text x="460" y="830" text-anchor="middle" font-size="13" fill="#cdbfe0">no currency: the cost of a unit is its cooldown</text>

  <!-- Side notes -->
  <g font-size="14" fill="#cdbfe0">
    <text x="80" y="670">• Start: you own 1 site, enemy owns 4</text>
    <text x="80" y="695">• Candies are only a score</text>
    <text x="80" y="720">• No win / no loss: max the candies</text>
    <text x="80" y="745">• Round lasts 3 min (assumed)</text>
    <text x="80" y="770">• Always able to spawn (home)</text>
    <text x="1090" y="670">• End: result overlay with candy total</text>
    <text x="1090" y="695">• Then "Continue" back to the lobby</text>
    <text x="1090" y="720">• No lobby integration yet</text>
  </g>
</svg>
